name: resort-voucher

services:
  # ---- Nginx (Web Server + WAF) -------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: resort_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-available:/etc/nginx/sites-available:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./public:/var/www/html/public:ro
      - ./storage:/var/www/html/storage:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./docker/nginx/logs:/var/log/nginx
    networks:
      - resort-network
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---- PHP-FPM (Application Server) ---------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resort_app
    restart: unless-stopped
    user: www-data
    volumes:
      # Persist storage (logs, uploads, framework files) across restarts
      - ./storage:/var/www/html/storage:delegated
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini:ro
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
    networks:
      - resort-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      PHP_OPCACHE_ENABLE: "1"
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---- MySQL (Database) ---------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: resort_mysql
    restart: unless-stopped
    user: mysql
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - resort-network
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE:-resort_voucher}"
      MYSQL_USER: "${DB_USERNAME:-resort_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_AUTHENTICATION_PLUGIN: "mysql_native_password"
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---- Redis (Cache, Session, Queue) --------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: resort_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    networks:
      - resort-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---- phpMyAdmin (optional, for client DB management) --------------------
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: resort_phpmyadmin
    restart: unless-stopped
    profiles:
      - dev
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: "${DB_USERNAME:-resort_user}"
      PMA_PASSWORD: "${DB_PASSWORD}"
      PMA_ARBITRARY: "0"
      UPLOAD_LIMIT: "100M"
      MEMORY_LIMIT: "256M"
      MAX_EXECUTION_TIME: "300"
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    networks:
      - resort-network
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  resort-network:
    driver: bridge
