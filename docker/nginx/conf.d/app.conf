# =============================================================================
# Main Nginx site configuration for resort-web-qr
# Includes WAF, security headers, rate limiting, and performance tuning
# =============================================================================

upstream php-fpm {
    server app:9000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80 default_server;
    server_name _;

    # ---- Document root ------------------------------------------------------
    root /var/www/html/public;
    index index.php;

    # ---- Logs ---------------------------------------------------------------
    access_log /var/log/nginx/app.access.log combined buffer=512k flush=1m;
    error_log  /var/log/nginx/app.error.log warn;

    # ---- Gzip ---------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml
        image/svg+xml
        font/woff font/woff2;

    # Reject known malicious user agents
    if ($bad_agent) {
        access_log off;
        return 403;
    }

    # =========================================================================
    # SECURITY HEADERS
    # =========================================================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" always;
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com;
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src 'self' data: https: blob:;
        connect-src 'self';
        media-src 'self';
        object-src 'none';
        frame-ancestors 'none';
        form-action 'self';
        base-uri 'self';
    " always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Security-Policy "default-src 'self'" always;

    # Remove fingerprint headers
    server_tokens off;

    # =========================================================================
    # SENSITIVE FILES & PATHS
    # =========================================================================
    location ~ /(\.env|\.env\.|composer\.json|composer\.lock|artisan|package\.json|package-lock\.json|Makefile|readme\.md|README\.md|docker-compose\.yml|Dockerfile|phpunit\.xml) {
        deny all;
        return 404;
    }

    location ~ /\.(git|svn|hg|bzr) {
        deny all;
        return 404;
    }

    location ~ /storage/logs/ {
        deny all;
        return 404;
    }

    location ~* \.(bak|backup|old|orig|swp|swo|tmp|sql|sqlite|db|log|env)$ {
        deny all;
        return 404;
    }

    location ~ /\.ht {
        deny all;
        return 404;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
        expires max;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # =========================================================================
    # STATIC ASSETS (long cache, no logging)
    # =========================================================================
    location ~* \.(css|js|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|webp|avif|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    # =========================================================================
    # LARAVEL FRONT CONTROLLER
    # =========================================================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        limit_req zone=general_limit burst=20 nodelay;
        limit_conn conn_limit 30;

        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param APP_ENV  "production";
        fastcgi_param APP_DEBUG "false";

        # Security: prevent PHP execution for non-PHP files
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Timeouts
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 30;
    }

    # =========================================================================
    # HTTP METHODS
    # =========================================================================
    if ($request_method !~ ^(GET|POST|HEAD|OPTIONS|PUT|PATCH|DELETE)$) {
        return 405;
    }

    # =========================================================================
    # BODY SIZE
    # =========================================================================
    client_max_body_size 20M;
    client_body_buffer_size 128k;
    client_body_timeout 30;

    # =========================================================================
    # BUFFER OVERFLOW PROTECTION
    # =========================================================================
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
}
