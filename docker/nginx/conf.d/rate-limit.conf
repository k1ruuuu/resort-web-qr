# =============================================================================
# Rate limiting zones — defined here in http context, used in app.conf
# =============================================================================

# API rate limit: 60 requests per minute per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

# Voucher operations: 10 requests per minute per IP
limit_req_zone $binary_remote_addr zone=voucher_limit:10m rate=10r/m;

# Login attempts: 5 requests per minute per IP
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# General request limit: 200 requests per minute per IP
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=200r/m;

# Connection limit per IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Burst for static resources (allow short bursts, then delay)
limit_req_zone $binary_remote_addr zone=static_limit:10m rate=100r/s;
