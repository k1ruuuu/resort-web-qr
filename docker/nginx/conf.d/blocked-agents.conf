# =============================================================================
# Malicious User-Agent blocking map
# Returns 1 if the user-agent matches a known scanner/bot/attack tool
# Reference in a server block: if ($bad_agent) { return 403; }
# =============================================================================

map $http_user_agent $bad_agent {
    default 0;

    # Web scanners & vulnerability tools
    ~*(sqlmap|nikto|nmap|masscan|acunetix|burpsuite|netsparker) 1;
    ~*(appscan|nessus|openvas|gobuster|dirbuster|wfuzz|hydra) 1;
    ~*(metasploit|havij|beef|w3af|webscarab|paros|wpscan) 1;
    ~*(arachni|wapiti|zap|skipfish|whatweb|grendel-scan) 1;

    # Library/script default UAs (used by automated attacks)
    ~*(ZmEu|libwww-perl|python-requests|aiohttp|httpx|guzzle) 1;
    ~*(Java\/|Jakarta Commons|HttpClient|OkHttp|PhantomJS) 1;

    # Download managers & mass scrapers
    ~*(wget|curl) 1;

    # Legacy/spam bots
    ~*(SemrushBot|AhrefsBot|MJ12bot|BLEXBot|DotBot) 1;
}
