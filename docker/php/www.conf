; =============================================================================
; PHP-FPM pool configuration for resort-web-qr
; Security-hardened: non-root user, limited children, restricted access
; =============================================================================

[www]
user = www-data
group = www-data

listen = 9000
; listen.allowed_clients = 127.0.0.1
listen.backlog = 128

; Process manager settings
pm = ondemand
pm.max_children = 50
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Security: only allow specific FastCGI params
pm.status_path = /status
ping.path = /ping
ping.response = pong

; Access and error logging
access.log = /proc/self/fd/2
access.format = "[%t] %R %m %{%F %T}s %{mili}dms %s %f %C%%"
catch_workers_output = yes
decorate_workers_output = no

; Environment variables to pass through (Laravel reads from $_ENV/$_SERVER)
env[APP_ENV] = $APP_ENV
env[APP_DEBUG] = $APP_DEBUG

; Security: limit extensions
security.limit_extensions = .php

; Timeouts
request_terminate_timeout = 300s
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

; Resource limits
rlimit_files = 65535
rlimit_core = 0
