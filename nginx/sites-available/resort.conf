server {
    listen 80;
    server_name _; # change to your domain or IP

    root /var/www/resort-web-qr/public;
    index index.php index.html index.htm;

    access_log /var/log/nginx/resort.access.log;
    error_log  /var/log/nginx/resort.error.log;

    # Try to serve static files first, then fallback to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP scripts to PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # Update fastcgi_pass to match your PHP-FPM socket or host:port
        # For system PHP-FPM (Debian/Ubuntu): unix:/run/php/php8.1-fpm.sock
        # For Docker with php-fpm service: php-fpm:9000
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
    }

    # Deny access to .env and other sensitive files
    location ~ /(\.env|composer\.json|composer\.lock|artisan) {
        deny all;
        return 404;
    }

    location ~ /\.git {
        deny all;
        return 404;
    }

    # Optional: increase client upload size for file uploads
    client_max_body_size 16M;
}
